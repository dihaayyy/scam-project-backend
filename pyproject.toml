[project]
name = "scam-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dihya Qalby", email = "148746377+dihaayyy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.141.1",
    "joblib>=1.6.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "scikit-learn==1.6.1",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
scam-project = "scam_project:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["src/tests"]
addopts = "-v"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
omit = [
    "src/tests/*",
    "src/migrations/*",
    "src/scam_project/*",
    "main.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
